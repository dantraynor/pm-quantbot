# Local development: builds from source
# Usage: docker compose -f docker-compose.yml -f infrastructure/compose/dev.yml up -d --build
services:
  ingestion:
    build:
      context: ./services/market-data/ingestion
      dockerfile: Dockerfile

  signal-core:
    build:
      context: ./services/market-data/signal-core
      dockerfile: Dockerfile

  execution:
    build:
      context: ./services/trading/execution
      dockerfile: Dockerfile

  settlement:
    build:
      context: ./services/trading/settlement
      dockerfile: Dockerfile

  btc-5m:
    build:
      context: ./services/strategies/btc-5m
      dockerfile: Dockerfile

  btc-5m-momentum:
    build:
      context: ./services/strategies/btc-5m-momentum
      dockerfile: Dockerfile

  btc-5m-latency:
    build:
      context: ./services/strategies/btc-5m-latency
      dockerfile: Dockerfile

  crypto-signals:
    build:
      context: .
      dockerfile: services/strategies/crypto-signals/Dockerfile

  alpha-executor:
    build:
      context: .
      dockerfile: services/trading/alpha-executor/Dockerfile

  sports-signals:
    build:
      context: .
      dockerfile: services/strategies/sports-signals/Dockerfile

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
